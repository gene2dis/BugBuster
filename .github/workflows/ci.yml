name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # one version failing does not cancel the other, so a failure on the
      # newest Nextflow alone points at Nextflow, not the change
      fail-fast: false
      matrix:
        NXF_VER:
          - "25.10.7"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      # The committed reads (tests/data/reads: the first 500 pairs of the
      # nf-core reads assets/test_samplesheet.csv points to), so CI downloads
      # no test data (roadmap Phase 25, RV27; review R8-11)
      - name: Write a samplesheet of the committed test reads
        run: |
          reads="${GITHUB_WORKSPACE}/tests/data/reads"
          printf 'sample,r1,r2,s\ntest_sample1,%s,%s,\ntest_sample2,%s,%s,\n' \
            "${reads}/test_sample1_R1.fastq.gz" "${reads}/test_sample1_R2.fastq.gz" \
            "${reads}/test_sample2_R1.fastq.gz" "${reads}/test_sample2_R2.fastq.gz" \
            > "${RUNNER_TEMP}/local_samplesheet.csv"

      - name: Run pipeline with test profile (stub)
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker -stub --input "${RUNNER_TEMP}/local_samplesheet.csv" --output ./results_stub

      - name: Run pipeline with test profile
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker --input "${RUNNER_TEMP}/local_samplesheet.csv" --output ./results

      - name: Check resource-limit overrides (-c, -params-file, CLI; design doc Q22)
        run: |
          tests/bin/test_resource_limits.sh

      - name: Check each profile's settings in the resolved config (roadmap Phase 22, RV15)
        run: |
          tests/bin/test_profile_config.sh

  lint:
    name: Nextflow lint, config and schema checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-everything"

      # Strict-syntax check of every script and config file (roadmap Phase 25,
      # RV27; review R8-12): errors fail the job, warnings are reported only
      - name: Lint the scripts and config files
        run: |
          nextflow lint .

      - name: Validate nextflow.config
        run: |
          nextflow config -flat ${GITHUB_WORKSPACE} > /dev/null

      - name: Check database-key enums against the registry (roadmap Phase 22, RV16)
        run: |
          tests/bin/test_schema_db_enums.sh

      - name: Validate nextflow_schema.json and its defaults against the config (roadmap Phase 25, RV27)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-jsonschema > /dev/null
          tests/bin/test_schema_params.sh

      - name: Check every tests/bin suite is run by this workflow (roadmap Phase 25, RV27)
        run: |
          tests/bin/test_ci_wiring.sh

  nf-test:
    name: Run nf-test suite
    runs-on: ubuntu-latest
    # 25.10.7 ran the suite in 3 h 12 min locally (roadmap Phase 22); the
    # newest Nextflow in ~75 min on CI
    timeout-minutes: 240
    strategy:
      # the minimum supported Nextflow and the newest (roadmap Phase 25, RV27;
      # review R8-13); one failing does not cancel the other
      fail-fast: false
      matrix:
        NXF_VER:
          - "25.10.7"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      # Pinned: the installer otherwise takes the newest release that day
      - name: Install nf-test 0.9.5
        run: |
          curl -fsSL https://get.nf-test.com | bash -s 0.9.5
          sudo mv nf-test /usr/local/bin/
          nf-test version

      - name: Run nf-test
        run: |
          nf-test test

  db-scripts:
    name: Test DB reformat scripts and pinned containers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Run DB reformat script regression tests (audit #3, #10, #21)
        run: |
          tests/bin/test_db_reformat_scripts.sh

  report-scripts:
    name: Test taxonomy/report scripts and pinned container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Run taxonomy script regression tests (audit #4, #12)
        run: |
          tests/bin/test_taxonomy_scripts.sh

      - name: Run report script regression tests (audit #13)
        run: |
          tests/bin/test_report_scripts.sh

      - name: Run Binette CheckM2 report conversion tests (performance review M7)
        run: |
          tests/bin/test_binette_quality_reports.sh

      - name: Run results summary regression tests
        run: |
          tests/bin/test_results_summary.sh

      - name: Run phyloseq RDS script tests (roadmap Phase 25, RV25)
        run: |
          tests/bin/test_tables_to_phyloseq.sh

      - name: Run GFF-to-SAF converter tests (design doc T3)
        run: |
          tests/bin/test_gff2saf.sh

      - name: Run bwa-mem3 alignment filter tests
        run: |
          tests/bin/test_filter_alignments.sh

      - name: Run co-assembly read-role tests
        run: |
          tests/bin/test_read_role.sh

      - name: Run decontamination read-count tests
        run: |
          tests/bin/test_clean_read_count.sh

      - name: Run MicrobeCensus base-count patch tests
        run: |
          tests/bin/test_microbe_census_count.sh

      - name: Run MEGAHIT memory wrapper tests
        run: |
          tests/bin/test_megahit_run.sh

      - name: Run functional aggregation script tests (design doc T4)
        run: |
          tests/bin/test_aggregate_functions.sh

      - name: Run read-level functional script tests (design doc T8a/T8b)
        run: |
          tests/bin/test_aggregate_read_functions.sh

      - name: Run SUPER-FOCUS backend script tests (design doc T8b)
        run: |
          tests/bin/test_superfocus_scripts.sh

      - name: Run HUMAnN backend script tests (design doc T8c)
        run: |
          tests/bin/test_humann_scripts.sh

      # The host checks and, in the image digest the module pins, the check
      # that the patch's version guard accepts the installed eggNOG-mapper
      # (roadmap Phase 25, RV26; review R8-05)
      - name: Run eggNOG-mapper OG-parsing patch tests in the pinned image (design doc Q23)
        run: |
          img=$(grep -o "'ghcr.io/gene2dis/bugbuster-eggnog-mapper@sha256:[0-9a-f]*'" \
            modules/local/eggnog_mapper_annotate/main.nf | tr -d "'")
          if [ -z "${img}" ]; then
            echo "ERROR: no pinned eggNOG-mapper digest in modules/local/eggnog_mapper_annotate/main.nf"
            exit 1
          fi
          EMAPPER_RUN="docker run --rm -i -v ${PWD}:${PWD} -w ${PWD} ${img}" \
            tests/bin/test_emapper_ogs_fix.sh

      - name: Check docs/WORKFLOW_DIAGRAM.md names every process (roadmap D1)
        run: |
          tests/bin/test_workflow_diagram.sh

      - name: Check module meta.yml descriptors against the process declarations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml > /dev/null
          tests/bin/test_module_meta.sh

      - name: Check every tool version key has a Methods reference (roadmap R12)
        run: |
          tests/bin/test_tool_references.sh

      - name: Run bin-directory recognition regression tests (audit #6)
        run: |
          tests/bin/test_identify_bin_dir.sh

      - name: Run GTDB-Tk per-sample split regression tests (roadmap Phase 20, RV3)
        run: |
          tests/bin/test_gtdbtk_split.sh

      - name: Run disk usage monitor test (roadmap Phase 21, RV12)
        run: |
          tests/bin/test_monitor_disk_usage.sh

      - name: Run RGI_BWT low-coverage fallback regression tests (audit #8)
        run: |
          tests/bin/test_rgi_bwt_fallback.sh

      - name: Run RGI k-mer database load tests (pathogen of origin)
        run: |
          tests/bin/test_rgi_load_kmers.sh

      - name: Run RGI kmer_query patch tests (KMA BAMs, dead workers, time limit)
        run: |
          tests/bin/test_rgi_kmer_kma_fix.sh

      - name: Run RGI bwt patch tests (mapped reads only, KMA failures)
        run: |
          tests/bin/test_rgi_bwt_kma_fix.sh

      - name: Run K-MARVEL output check tests (zero ARGs, BLAST failure)
        run: |
          tests/bin/test_kmarvel_check_output.sh

      - name: Run K-MARVEL database version tests (DB_VERSION, md5 fallback)
        run: |
          tests/bin/test_kmarvel_db_version.sh

      - name: Run BLOBTOOLS read-only image regression test (design doc Q21)
        run: |
          tests/bin/test_blobtools_readonly.sh
