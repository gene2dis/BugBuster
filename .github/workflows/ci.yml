name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER:
          - "25.10.7"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Run pipeline with test profile (stub)
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker -stub --output ./results_stub

      - name: Run pipeline with test profile
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker --output ./results

      - name: Check resource-limit overrides (-c, -params-file, CLI; design doc Q22)
        run: |
          tests/bin/test_resource_limits.sh

  lint:
    name: Nextflow config lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-everything"

      - name: Validate nextflow.config
        run: |
          nextflow config -flat ${GITHUB_WORKSPACE} > /dev/null

      - name: Check schema validation
        run: |
          if [ -f "nextflow_schema.json" ]; then
            echo "Schema file exists"
            python3 -c "import json; json.load(open('nextflow_schema.json'))"
          fi

  nf-test:
    name: Run nf-test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "latest-everything"

      - name: Install nf-test
        run: |
          curl -fsSL https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run nf-test
        run: |
          nf-test test

  db-scripts:
    name: Test DB reformat scripts and pinned containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Run DB reformat script regression tests (audit #3, #10, #21)
        run: |
          tests/bin/test_db_reformat_scripts.sh

  report-scripts:
    name: Test taxonomy/report scripts and pinned container
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Run taxonomy script regression tests (audit #4, #12)
        run: |
          tests/bin/test_taxonomy_scripts.sh

      - name: Run report script regression tests (audit #13)
        run: |
          tests/bin/test_report_scripts.sh

      - name: Run GFF-to-SAF converter tests (design doc T3)
        run: |
          tests/bin/test_gff2saf.sh

      - name: Run functional aggregation script tests (design doc T4)
        run: |
          tests/bin/test_aggregate_functions.sh

      - name: Run read-level functional script tests (design doc T8a/T8b)
        run: |
          tests/bin/test_aggregate_read_functions.sh

      - name: Run SUPER-FOCUS backend script tests (design doc T8b)
        run: |
          tests/bin/test_superfocus_scripts.sh

      - name: Run HUMAnN backend script tests (design doc T8c)
        run: |
          tests/bin/test_humann_scripts.sh

      - name: Run eggNOG-mapper OG-parsing patch tests (design doc Q23)
        run: |
          tests/bin/test_emapper_ogs_fix.sh

      - name: Check module meta.yml descriptors against the process declarations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml > /dev/null
          tests/bin/test_module_meta.sh

      - name: Run bin-directory recognition regression tests (audit #6)
        run: |
          tests/bin/test_identify_bin_dir.sh

      - name: Run RGI_BWT low-coverage fallback regression tests (audit #8)
        run: |
          tests/bin/test_rgi_bwt_fallback.sh

      - name: Run BLOBTOOLS read-only image regression test (design doc Q21)
        run: |
          tests/bin/test_blobtools_readonly.sh
