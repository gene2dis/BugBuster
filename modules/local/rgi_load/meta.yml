name: rgi_load
description: Downloads the CARD database (latest or a given version) and loads it, with its annotated reference sequences and optionally the WildCARD variants, into a local RGI database with rgi load --local
keywords:
  - antimicrobial resistance
  - card
  - wildcard
  - database
tools:
  - rgi:
      description: Resistance Gene Identifier, predicts resistomes from protein or nucleotide data, including metagenomic reads, against CARD (RGI 6.0.3)
      homepage: https://github.com/arpcard/rgi
      documentation: https://github.com/arpcard/rgi/blob/master/README.rst
      doi: "10.1093/nar/gkac920"

input:
  - card_version:
      type: value
      description: CARD release to download, 'latest' or a version number (broadstreet-v<version>.tar.bz2), from --rgi_card_version
  - include_wildcard:
      type: value
      description: Boolean; when true the latest WildCARD variants are downloaded, annotated with rgi wildcard_annotation and loaded (can take 30-60 minutes)

output:
  - card_db:
      type: directory
      description: Local RGI database directory (card.json, card_database_v*.fasta, localDB/, database_version.txt, plus WildCARD files when requested)
      pattern: "card_db"
  - versions:
      type: file
      description: Software versions (rgi and the CARD version from card.json)
      pattern: "versions.yml"

authors:
  - "@juanu"
