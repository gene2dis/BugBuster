name: taxonomy_report
description: Generate unified taxonomy classification reports and plots for Kraken2, Sourmash or Sylph
keywords:
  - taxonomy
  - classification
  - kraken2
  - sourmash
  - sylph
  - report
  - visualization
tools:
  - custom:
      description: Python-based taxonomy report generator
      homepage: https://github.com/gene2dis/BugBuster
      documentation: https://github.com/gene2dis/BugBuster/docs
      tool_dev_url: https://github.com/gene2dis/BugBuster
      licence: ["MIT"]

input:
  - reports:
      type: file
      description: Taxonomy report files - raw Kraken2 reports, or the per-sample report TSVs of the SOURMASH / SYLPH_PROFILE modules (Id, <Tool> DB, Unclassified, Classified; extra columns are dropped)
      pattern: "*.{tsv,txt}"
  - reads_report:
      type: file
      description: Existing reads report CSV file to merge with taxonomy data
      pattern: "*.csv"
  - profiler:
      type: value
      description: Taxonomic profiler used ('kraken2', 'sourmash' or 'sylph')
  - db_name:
      type: value
      description: Database name for labeling outputs

output:
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - report:
      type: file
      description: Updated reads report with taxonomy statistics
      pattern: "Reads_report.csv"
  - plots:
      type: file
      description: Classified / unclassified reads per sample (Kraken_plot, sourmash_tax_classified_reads or sylph_tax_classified_reads) as .pdf / .svg / .png (600 dpi), with its plotted values as .csv
      pattern: "{Kraken_plot,sourmash_tax_classified_reads,sylph_tax_classified_reads}.{pdf,svg,png,csv}"

authors:
  - "@ffuentessantander"
  - "@jugalde"
