name: eggnog_mapper_annotate
description: eggNOG-mapper stage 2 - orthology-transfer annotation of seed orthologs (-m no_search --annotate_hits_table)
keywords:
  - functional annotation
  - orthology
  - KEGG
  - COG
  - metagenomics
tools:
  - eggnog-mapper:
      description: Fast genome-wide functional annotation through orthology assignment
      homepage: http://eggnog-mapper.embl.de
      documentation: https://github.com/eggnogdb/eggnog-mapper/wiki
      doi: "10.1093/molbev/msab293"
      licence: ["AGPL-3.0"]

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name, or 'coassembly')
  - seed_orthologs:
      type: file
      description: Seed orthologs table from EGGNOG_MAPPER_SEARCH
      pattern: "*.emapper.seed_orthologs"
  - eggnog_db:
      type: directory
      description: eggNOG 7 data directory (emapper-3.0 layout - eggnog.db plus fieldpresence/taxids caches, eggnog.taxa.db plus traverse.pkl, eggnog_proteins.dmnd, go-basic.obo)
      pattern: "eggnog_db"

output:
  - annotations:
      type: file
      description: Functional annotations per query (KEGG_ko, COG_category, EC, PFAMs, CAZy, ...); v3 emits 22 columns with a positional annotation_confidence code
      pattern: "*.emapper.annotations"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
