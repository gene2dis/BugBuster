name: eggnog_mapper_search
description: eggNOG-mapper stage 1 - DIAMOND search of predicted proteins against the eggNOG 7 database, annotation deferred (--no_annot)
keywords:
  - functional annotation
  - orthology
  - diamond
  - metagenomics
tools:
  - eggnog-mapper:
      description: Fast genome-wide functional annotation through orthology assignment
      homepage: http://eggnog-mapper.embl.de
      documentation: https://github.com/eggnogdb/eggnog-mapper/wiki
      doi: "10.1093/molbev/msab293"
      licence: ["AGPL-3.0"]

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name, or 'coassembly')
  - proteins:
      type: file
      description: Predicted protein FASTA from gene calling (gzipped accepted)
      pattern: "*.{faa,faa.gz}"
  - eggnog_db:
      type: directory
      description: eggNOG 7 data directory (emapper-3.0 layout - eggnog.db plus fieldpresence/taxids caches, eggnog.taxa.db plus traverse.pkl, eggnog_proteins.dmnd, go-basic.obo)
      pattern: "eggnog_db"

output:
  - seed_orthologs:
      type: file
      description: Per-query seed orthologs table from the DIAMOND search
      pattern: "*.emapper.seed_orthologs"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
