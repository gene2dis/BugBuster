name: arg_blobplot
description: Blob plot of the ARG-carrying contigs per assembly (GC content vs log10 coverage, point size by contig length, one point per contig) coloured by the eight DeepARG ARG classes with the most contigs ('multiple classes' for a contig with hits in several), with a bar panel of each class's share of those contigs (bin/arg_blobplot.py, shared figure style of bin/figure_style.py)
keywords:
  - antimicrobial resistance
  - blob plot
  - contigs
  - visualization
tools:
  - pandas:
      description: Python data analysis library used by the plotting script
      homepage: https://pandas.pydata.org
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]
  - matplotlib:
      description: Python plotting library used to draw the two-panel figures
      homepage: https://matplotlib.org
      documentation: https://matplotlib.org/stable/
      doi: "10.1109/MCSE.2007.55"

input:
  - arg_contig_data:
      type: file
      description: Merged contig taxonomy and ARG table from ARG_CONTIG_LEVEL_REPORT (tab-separated; the script reads it by this fixed name)
      pattern: "Contig_tax_and_arg_prediction.tsv"

output:
  - plots:
      type: file
      description: One figure per assembly, <assembly>_ARG_blob_plot.pdf / .svg / .png (600 dpi), with its plotted values as .csv; an assembly without ARG-carrying contigs gets a figure saying so
      pattern: "*_ARG_blob_plot.{pdf,svg,png,csv}"
  - versions:
      type: file
      description: Software versions (python, pandas, matplotlib)
      pattern: "versions.yml"

authors:
  - "@juanu"
