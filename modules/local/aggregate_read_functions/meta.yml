name: aggregate_read_functions
description: Study-level aggregation of the read-level functional branch into the canonical function abundance schema (source=reads), with wide matrices, annotated fractions and a per-sample summary; reported separately from the contig branch
keywords:
  - functional profiling
  - read-level
  - aggregation
  - normalization
  - metagenomics
tools:
  - pandas:
      description: Python data analysis library (runs bin/aggregate_read_functions.py)
      homepage: https://pandas.pydata.org/
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]

input:
  - functions:
      type: file
      description: All samples' per-function tables from WOLTKA_CLASSIFY or SUPERFOCUS
      pattern: "*.{woltka,superfocus}_functions.tsv"
  - summaries:
      type: file
      description: All samples' assigned/annotated read summaries
      pattern: "*.{woltka,superfocus}_summary.tsv"
  - unassigned:
      type: file
      description: All samples' unassigned-read tables (woltka only; empty for superfocus)
      pattern: "*.woltka_unassigned.tsv"
  - ags:
      type: file
      description: MicrobeCensus AGS tables (optional; samples without one get blank CPGE; superfocus reports AGS/GE only, CPGE not applicable)
      pattern: "*.ags.tsv"
  - backend_versions:
      type: file
      description: WOLTKA_CLASSIFY or SUPERFOCUS versions.yml, read by the version-aware layout guard
      pattern: "*.yml"
  - backend:
      type: string
      description: Read-level backend name ('woltka' or 'superfocus')

output:
  - function_abundance:
      type: file
      description: Section 5.3 table with source=reads (abundance_native = read counts, abundance_cpge = RPK / genome equivalents for woltka and empty for superfocus, abundance_tpm empty)
      pattern: "read_function_abundance.tsv"
  - function_wide:
      type: file
      description: Wide matrices per ontology - woltka: ko, ec, cog, pfam, metacyc (native read counts and CPGE); superfocus: seed_level1, seed_level2, seed_level3 (native read counts only)
      pattern: "read_function_wide_*.tsv"
  - annotated_fraction:
      type: file
      description: Per sample, the share of reads carrying a term, overall and per ontology (woltka - of ORF-assigned reads; superfocus - of all reads given to SUPER-FOCUS)
      pattern: "read_annotated_fraction.tsv"
  - sample_summary:
      type: file
      description: Per sample, backend/tool/database versions, reads assigned, reads unassigned by ambiguity (woltka only), AGS/GE and the CPGE status (ok/unavailable; not_applicable for superfocus)
      pattern: "read_sample_summary.tsv"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
