name: results_summary
description: Run-level summary of QC, taxonomy, read-level ARG (K-MARVEL, RGI, ARGs-OAP), read functional and MicrobeCensus results (bin/results_summary.py and its summary_*.py modules) - tidy and wide TSV tables, an Excel workbook, PDF/PNG/SVG figures, a self-contained HTML report, a README (Markdown and DOCX) and LLM_GUIDE.md (the summary folder and every column, for a language model or a script). Counts are in read pairs; ARG abundance is normalised to RPM/RPKM of clean read pairs; ARGs get a reporting tier from an editable rule table, and variant-model hits are checked against CARD snps.txt. RGI bwt genes count at --rgi_summary_min_coverage % coverage of their best reference sequence and carry RGI's k-mer pathogen of origin; when both K-MARVEL and RGI ran, the two are compared gene by gene (UpSet plot, overlap tables). The same script runs outside the pipeline on several published results directories (batches).
keywords:
  - report
  - summary
  - taxonomy
  - antimicrobial resistance
tools:
  - pandas:
      description: Python data analysis library used by the summary script
      homepage: https://pandas.pydata.org
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]
  - matplotlib:
      description: Figures (PNG, PDF and SVG; the SVGs are embedded in the HTML report)
      homepage: https://matplotlib.org
      documentation: https://matplotlib.org/stable/
      licence: ["PSF-based"]
  - openpyxl:
      description: Excel workbook output
      homepage: https://openpyxl.readthedocs.io
      documentation: https://openpyxl.readthedocs.io
      licence: ["MIT"]

input:
  - reads_report:
      type: file
      description: Reads_report.csv (read counts per step in single reads; the TAXONOMY_REPORT version adds the profiler's classified fraction)
      pattern: "*.csv"
  - fastp_jsons:
      type: file
      description: Per-sample fastp JSON reports (mean read length); empty without QC
      pattern: "*.fastp.json"
  - taxonomy_tables:
      type: file
      description: TAXONOMY_PHYLOSEQ OTU, taxonomy and (sylph) read-count tables; empty without a profiler
      pattern: "*_{otu_table,tax_table,read_counts}.tsv"
  - sylph_profiles:
      type: file
      description: Raw per-sample sylph profiles (ANI, coverage); empty unless the profiler is sylph
      pattern: "*_sylph_*.tsv"
  - kmarvel_tsvs:
      type: file
      description: Per-sample K-MARVEL tables; empty unless --kmarvel_prediction
      pattern: "*_kmarvel.tsv"
  - kmarvel_db:
      type: directory
      description: K-MARVEL CARD directory; its snps.txt is used to check variant-model hits for resistance mutations
  - rgi_alleles:
      type: file
      description: Per-sample RGI bwt allele tables; empty unless --rgi_prediction
      pattern: "*_rgi_bwt.allele_mapping_data.txt"
  - rgi_kmer_genes:
      type: file
      description: Per-sample RGI k-mer (pathogen of origin) gene tables; empty without RGI_KMER
      pattern: "*_rgi_kmer_*mer_analysis.gene.txt"
  - software_versions:
      type: file
      description: The run's aggregated software_versions.yml, shown in the report
      pattern: "software_versions.yml"
  - sample_metadata:
      type: file
      description: Optional TSV/CSV with a 'sample' column (or sample names in the first column) and any metadata columns
      pattern: "*.{tsv,csv,txt}"
  - card_prevalence:
      type: file
      description: Optional WildCARD card_prevalence.txt; adds candidate ARG hosts (co-occurring known carriers) and CARD plasmid association
      pattern: "card_prevalence.txt"
  - arg_priority:
      type: file
      description: ARG tier rule table (default assets/arg_priority_tiers.tsv)
      pattern: "*.tsv"
  - watchlist:
      type: file
      description: Watchlist taxa (default assets/summary_watchlist.tsv)
      pattern: "*.tsv"
  - report_assets:
      type: directory
      description: The report's templates, styles and references (assets/report - Typst templates, Jinja HTML templates, site.css and tables.js, references.yml and tool_references.tsv); a tuple with report_assets_hash
  - report_assets_hash:
      type: string
      description: Hash of the contents of report_assets' files (main.nf). A directory input is cached by its own path, size and mtime, so this is what makes an edited template rerun the task on -resume
  - stage_reports:
      type: file
      description: Run-level tables of other stages, laid out at their published paths by file name - ARGS_OAP_REPORT's args_oap_long.tsv and args_oap_cells.tsv, AGGREGATE_READ_FUNCTIONS' read_function_abundance.tsv, read_annotated_fraction.tsv and read_sample_summary.tsv, MicrobeCensus <sample>.ags.tsv, and ARG_CONTIG_LEVEL_REPORT's Contig_tax_and_arg_prediction.tsv (arg_contig_mobile); [] when none ran
      pattern: "{args_oap_*.tsv,read_*.tsv,*.ags.tsv,Contig_tax_and_arg_prediction.tsv}"

output:
  - html:
      type: file
      description: Entry page that opens the HTML report (report/index.html)
      pattern: "results_summary.html"
  - site:
      type: directory
      description: Multi-page offline HTML report - an overview, one page per section whose stage ran, methods (tool versions and references) and a data dictionary; interactive Vega-Lite versions of the large figures, sortable and filterable tables, the Vega libraries bundled once, nothing loaded from the network
      pattern: "report"
  - pdf:
      type: file
      description: The same report typeset by Typst (long tables capped with a pointer to the TSV, methods with tool versions and references in Nature style; fonts embedded)
      pattern: "results_summary.pdf"
  - xlsx:
      type: file
      description: Excel workbook with every table and a README sheet defining the columns
      pattern: "results_summary.xlsx"
  - tables:
      type: file
      description: samples_qc, taxonomy_long, taxonomy_<rank>_wide, taxonomy_species_prevalence, watchlist, arg_long, arg_gene_rpkm, arg_family_rpkm, arg_presence, arg_drug_class_rpkm, arg_priority_panel, (with a grouping column) group_arg_detection, (when K-MARVEL and RGI both ran) arg_method_comparison and arg_method_overlap, (ARGs-OAP) arg_sarg_long, arg_sarg_type_cpc, arg_sarg_subtype_cpc, and (read functional) function_read_long and function_read_<ontology>
      pattern: "tables/*.tsv"
  - figures:
      type: file
      description: QC read fate (with depth marks), species and genus heatmaps, genus bars, watchlist, ARG heatmaps, ARG detection versus depth, and, when K-MARVEL and RGI both ran, the method comparison (UpSet plot and agreement by tier and category), ARGs-OAP copies per cell by SARG type, the COG categories of the read and contig functional profiles, MAG quality and abundance, and ARG genes on contigs by host; each as PDF, SVG and PNG (600 dpi) at 89 or 183 mm wide, with its plotted values as CSV
      pattern: "figures/*"
  - readme:
      type: file
      description: What the summary holds - stages run per results directory, tables, figures, units, tiers, caveats and software versions
      pattern: "README.md"
  - llm_guide:
      type: file
      description: Guide for a language model or a script - run facts (YAML), the stages that ran, methods, every table column and figure, pitfalls and recipes; paths relative to the summary folder, no local path
      pattern: "LLM_GUIDE.md"
  - versions:
      type: file
      description: Software versions (python, pandas, matplotlib, openpyxl, typst, jinja2, altair, vl-convert)
      pattern: "versions.yml"

authors:
  - "@juanu"
