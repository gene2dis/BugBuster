name: deeparg
description: Antimicrobial resistance gene prediction with DeepARG (predict, LS model, protein mode) on the shared Pyrodigal proteins of an assembly (DEEPARG_CONTIGS); its hits also give the bin-level ARGs (BIN_ARG_SPLIT). DIAMOND and OpenBLAS threads are bounded to the task's CPUs
keywords:
  - antimicrobial resistance
  - ARG
  - deeparg
  - deep learning
tools:
  - deeparg:
      description: A deep learning based approach to predict antibiotic resistance genes (ARGs) from metagenomes (1.0.4)
      homepage: https://github.com/gaarangoa/deeparg
      documentation: https://github.com/gaarangoa/deeparg
      doi: "10.1186/s40168-018-0401-z"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name, or 'coassembly')
  - prodigal_contigs:
      type: file
      description: Predicted contig proteins from the shared Pyrodigal gene-calling step (gzipped accepted)
      pattern: "*.{faa,faa.gz}"
  - deeparg_db:
      type: directory
      description: DeepARG data directory (DOWNLOAD_DEEPARG_DB or a custom path)
output:
  - deeparg:
      type: file
      description: Tuple of meta and the DeepARG predictions (<sample>_contigs_deep_arg.out.mapping.ARG)
      pattern: "*.ARG"
  - only_deeparg:
      type: file
      description: The same DeepARG predictions without meta
      pattern: "*.ARG"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
