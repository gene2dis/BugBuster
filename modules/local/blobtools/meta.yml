name: blobtools
description: Builds a BlobTools v1 BlobDB from contigs, their Metabuli calls (one hit per classified contig), read mappings and the Metabuli database's taxdump, then tabulates it at all taxonomic ranks (blobtools create + view); the taxdump's 2025 'domain' rank and the Viruses node are renamed 'superkingdom' in a task-dir copy of nodes.dmp
keywords:
  - contig taxonomy
  - blobtools
  - taxonomic assignment
  - metagenomics
tools:
  - blobtools:
      description: Interrogation of genome assemblies via taxon-annotated GC-coverage plots (BlobTools v1, 1.1.1)
      homepage: https://github.com/DRL/blobtools
      documentation: https://blobtools.readme.io/docs
      doi: "10.12688/f1000research.12232.1"

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name, or 'coassembly')
  - contigs:
      type: file
      description: Assembled contigs
  - hits:
      type: file
      description: BlobTools hits file from METABULI_CLASSIFY (contig, taxid, Metabuli score)
      pattern: "*_metabuli_hits.tsv"
  - bam:
      type: file
      description: Reads mapped back to the contigs, used for coverage
      pattern: "*.bam"
  - bam_bai:
      type: file
      description: Index of the BAM file
      pattern: "*.bai"
  - tax_files:
      type: file
      description: nodes.dmp and names.dmp of the Metabuli database (the taxdump its taxids come from)

output:
  - blob_table:
      type: file
      description: Tuple of meta and the BlobTools view table (<sample>_Blob_table.*), all ranks
      pattern: "*_Blob_tabl*"
  - only_blob:
      type: file
      description: The same BlobTools view table without meta, collected for BLOBPLOT
      pattern: "*_Blob_tabl*"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
