name: kmarvel_report
description: Study-level K-MARVEL report that merges the per-sample ARG tables into a long table, ARG x sample and AMR gene family x sample matrices of supporting read pairs, and a drug class x sample ARG-count matrix (bin/kmarvel_report.py); samples without ARGs stay as all-zero columns
keywords:
  - antimicrobial resistance
  - kmarvel
  - report
tools:
  - pandas:
      description: Python data analysis library used by the report script
      homepage: https://pandas.pydata.org
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]

input:
  - kmarvel_tsvs:
      type: file
      description: Collected per-sample K-MARVEL tables; the sample name is the file name without _kmarvel.tsv
      pattern: "*_kmarvel.tsv"

output:
  - reports:
      type: file
      description: KMARVEL_summary_long.tsv, KMARVEL_supporting_reads_matrix.tsv (per CARD ARO), KMARVEL_gene_family_matrix.tsv (per AMR gene family; compare samples here, as the reported allele among close variants is not stable) and KMARVEL_drug_class_matrix.tsv; supporting reads count read pairs (both mates once), raw counts, not normalised
      pattern: "KMARVEL_*.tsv"
  - versions:
      type: file
      description: Software versions (python, pandas)
      pattern: "versions.yml"

authors:
  - "@juanu"
