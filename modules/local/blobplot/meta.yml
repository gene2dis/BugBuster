name: blobplot
description: Phylum blob plot per assembly (contig GC vs coverage, coloured by phylum, and each phylum's share of the contig length) from the BlobTools tables, drawn by bin/blobplot.py in the shared figure style (bin/figure_style.py)
keywords:
  - blob plot
  - contig taxonomy
  - visualization
  - metagenomics
tools:
  - pandas:
      description: Python data analysis library used by bin/blobplot.py to read the BlobTools tables
      homepage: https://pandas.pydata.org
      documentation: https://pandas.pydata.org/docs/
      licence: ["BSD-3-Clause"]
  - matplotlib:
      description: Python plotting library used by bin/blobplot.py to draw the figures
      homepage: https://matplotlib.org
      documentation: https://matplotlib.org/stable/

input:
  - blob_data:
      type: file
      description: BlobTools view tables of all samples (collected); the sample name is the file name prefix before '_Blob_table'
      pattern: "*Blob_table*"

output:
  - plots:
      type: file
      description: One figure per assembly, <assembly>_Phylum_blob_plot.pdf / .svg / .png (600 dpi), with its plotted values as .csv
      pattern: "*_Phylum_blob_plot.{pdf,svg,png,csv}"
  - versions:
      type: file
      description: Software versions (python, pandas, matplotlib)
      pattern: "versions.yml"

authors:
  - "@juanu"
