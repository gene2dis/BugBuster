name: bedtools
description: Per-bin read coverage under co-assembly binning - a contig -> bin table, then bedtools genomecov on each sample's co-assembly BAM, reporting each bin's contig count and the mean of its per-contig average depths
keywords:
  - coverage
  - depth
  - bins
  - bedtools
tools:
  - bedtools:
      description: Toolset for genome arithmetic; this module uses genomeCoverageBed (bedtools genomecov) histogram output
      homepage: https://bedtools.readthedocs.io/en/latest/
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/genomecov.html
      doi: "10.1093/bioinformatics/btq033"
      licence: ["MIT"]

processes:
  - name: BIN_CONTIG_TABLE
    description: |
      Writes the contig -> bin table of the refined bins (contig = first header word, bin id = FASTA
      basename). Contigs already present in an earlier bin are skipped with a warning; a bin without
      sequences, or with only contigs of earlier bins, gets one row with an empty contig field.
    input:
      - bins:
          type: directory
          description: Refined bin directory (bins as *.fa)
    output:
      - table:
          type: file
          description: contig_to_bin.tsv (contig TAB bin)
          pattern: "contig_to_bin.tsv"
      - versions:
          type: file
          description: Software versions
          pattern: "versions.yml"

  - name: BEDTOOLS_BIN_DEPTH
    description: |
      Co-assembly bin coverage of one sample, from its alignment against the co-assembly (either aligner);
      contigs are assigned to bins through contig_to_bin.tsv (BIN_CONTIG_TABLE), other contigs are ignored.
    input:
      - meta:
          type: map
          description: Sample metadata (meta.id is the sample whose reads were mapped to the bins)
      - bam:
          type: file
          description: Sorted BAM of the sample's reads against the co-assembly (BWAMEM3_SAMTOOLS or BOWTIE2_SAMTOOLS)
          pattern: "*_all_reads.bam"
      - contig_to_bin:
          type: file
          description: contig TAB bin table; a row with an empty contig field marks a bin without sequences
          pattern: "contig_to_bin.tsv"
    output:
      - bin_depth:
          type: file
          description: TSV with columns sample, bin_id, Total_contigs and average_cov, one row per bin
          pattern: "*_bin_depth.tsv"
      - versions:
          type: file
          description: Software versions
          pattern: "versions.yml"

authors:
  - "@juanu"
