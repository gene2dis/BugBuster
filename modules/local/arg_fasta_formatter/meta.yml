name: arg_fasta_formatter
description: Extracts the protein sequences of DeepARG-predicted ARGs from the per-bin Prodigal proteins of one sample (extract_sequences.py run once per bin with hits), for bin-level ARG clustering
keywords:
  - antimicrobial resistance
  - bins
  - protein sequences
  - fasta
tools:
  - biopython:
      description: Python tools for computational molecular biology, used by the bin/extract_sequences.py helper (copied from the former quay.io/ffuentessantander/biopython_utils:1.0 image)
      homepage: https://biopython.org
      documentation: https://biopython.org/wiki/Documentation
      doi: "10.1093/bioinformatics/btp163"

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name)
  - proteins:
      type: directory
      description: BIN_ARG_SPLIT output directory with the Pyrodigal proteins of each refined bin (<sample>_<bin>_proteins.faa)
      pattern: "*_bins_proteins"
  - deeparg:
      type: directory
      description: BIN_ARG_SPLIT output directory with each bin's DEEPARG_CONTIGS hits (<sample>_<bin>_deep_arg.out.mapping.ARG; header only for a bin without hits)
      pattern: "*_deeparg_results"

output:
  - arg_reports:
      type: file
      description: ARG protein FASTA written by extract_sequences.py from the bin protein file and its DeepARG hit list (read id, ARG, class, best hit); bins without hits are skipped
      pattern: "*_ARGs.faa"
  - versions:
      type: file
      description: Software versions (python, biopython)
      pattern: "versions.yml"

authors:
  - "@juanu"
