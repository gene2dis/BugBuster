name: bowtie2_samtools
description: |
  Bowtie2 read mapping with samtools sorting (--read_aligner bowtie2). Builds a Bowtie2 index of the filtered
  contigs, maps one sample's paired reads (and singletons when present, merged into the same BAM) and
  coordinate-sorts with samtools, against the sample's own contigs or the co-assembly (the co-assembly's
  pooled BAM is a samtools merge of these). A contig file with no sequences yields a header-only BAM plus an
  empty-contig report instead of failing.
keywords:
  - alignment
  - bowtie2
  - samtools
  - bam
  - metagenomics
tools:
  - bowtie2:
      description: Ultrafast and memory-efficient aligner of sequencing reads to long reference sequences (bowtie2-build, bowtie2)
      homepage: http://bowtie-bio.sourceforge.net/bowtie2/index.shtml
      documentation: http://bowtie-bio.sourceforge.net/bowtie2/manual.shtml
      doi: "10.1038/nmeth.1923"
      licence: ["GPL-3.0-or-later"]
  - samtools:
      description: Tools for manipulating SAM/BAM alignments (sort, merge, view)
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]

input:
  - meta:
      type: map
      description: Sample metadata (meta.id is the sample name)
  - reads:
      type: file
      description: Host-removed reads of one sample - R1, R2 and optional singleton, by position
      pattern: "*.fastq.gz"
  - contigs:
      type: file
      description: Length-filtered contigs from BBMAP (the sample's own, or the co-assembly)
      pattern: "*_filtered_contigs.fa"

output:
  - contigs_and_bam:
      type: tuple
      description: Tuple of meta, the input contigs and the sorted BAM
      pattern: "*_all_reads.bam"
  - bam_only:
      type: tuple
      description: Tuple of meta and the sorted BAM (header-only when the contig file was empty)
      pattern: "*_all_reads.bam"
  - empty_contig_report:
      type: file
      description: Optional; written only when the contig file had no sequences (sample_id, stage, timestamp, action_taken); aggregated by CONTIG_FILTER_SUMMARY
      pattern: "*_empty_contig_report.txt"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
