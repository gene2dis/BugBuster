name: clustering
description: Clusters the predicted ARG protein sequences of all bins with MMseqs2 easy-cluster at four fixed identity tiers (90/95% with 80% coverage, 99/100% with 90% coverage)
keywords:
  - clustering
  - antimicrobial resistance
  - ARG
  - mmseqs2
tools:
  - mmseqs2:
      description: Ultra fast and sensitive protein sequence search and clustering suite (15.6f452)
      homepage: https://github.com/soedinglab/MMseqs2
      documentation: https://github.com/soedinglab/MMseqs2/wiki
      doi: "10.1038/nbt.3988"

input:
  - arg_faa:
      type: file
      description: ARG protein FASTA files from ARG_FASTA_FORMATTER (collected), concatenated into one clustering input
      pattern: "*.faa"

output:
  - clusters:
      type: file
      description: Cluster membership tables, one per tier (Arg_cluster_{90,95,99,100}_cluster.tsv)
      pattern: "*_cluster.tsv"
  - versions:
      type: file
      description: Software versions
      pattern: "versions.yml"

authors:
  - "@juanu"
