name: taxonomy_phyloseq
description: Generate phyloseq-compatible tables and visualizations from Kraken2/Bracken, Sourmash or Sylph taxonomy data
keywords:
  - taxonomy
  - phyloseq
  - kraken2
  - bracken
  - sourmash
  - sylph
  - abundance
  - visualization
tools:
  - custom:
      description: Python-based phyloseq table generator
      homepage: https://github.com/gene2dis/BugBuster
      documentation: https://github.com/gene2dis/BugBuster/docs
      tool_dev_url: https://github.com/gene2dis/BugBuster
      licence: ["MIT"]

input:
  - input_files:
      type: file
      description: Input files - kraken-style Bracken reports for Kraken2, gather CSV files with lineages for Sourmash, or sylph-tax .sylphmpa profiles plus the SYLPH_PROFILE per-sample report TSVs (for the read-pair counts) for Sylph
      pattern: "*.{txt,csv,sylphmpa,tsv}"
  - profiler:
      type: value
      description: Taxonomic profiler used ('kraken2', 'sourmash' or 'sylph')
  - db_name:
      type: value
      description: Database name for labeling outputs
  - plot_levels:
      type: value
      description: Comma-separated taxonomic levels to plot (e.g., 'Phylum,Family,Genus,Species')
  - top_n:
      type: integer
      description: Number of top taxa to show in plots

output:
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - otu_table:
      type: file
      description: OTU/abundance table in TSV format (taxa × samples)
      pattern: "*_otu_table.tsv"
  - tax_table:
      type: file
      description: Taxonomy table in TSV format (taxa × taxonomic ranks)
      pattern: "*_tax_table.tsv"
  - sample_metadata:
      type: file
      description: Sample metadata table in TSV format
      pattern: "*_sample_metadata.tsv"
  - phyloseq_h5:
      type: file
      description: Phyloseq data in HDF5 format for Python analysis
      pattern: "*_phyloseq_data.h5"
  - read_counts:
      type: file
      description: Sylph only - estimated read pairs per genome (taxa × samples, same rows as the OTU table, which holds relative abundance), sequence_abundance / 100 × the sample's read pairs
      pattern: "*_read_counts.tsv"
  - plots:
      type: file
      description: Relative abundance plots at various taxonomic levels
      pattern: "*.png"

authors:
  - "@ffuentessantander"
  - "@jugalde"
